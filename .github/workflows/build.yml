name: build-apk
on:
  push:
  workflow_dispatch:
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - name: Unpack app
        run: echo "$SRC" | base64 -d | tar -xJ
        env:
          SRC: 
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"
      - name: Build
        run: cd QuietLauncher && gradle assembleRelease --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: quiet-launcher-apk
          path: QuietLauncher/app/build/outputs/apk/release/app-release.apk
