name: build-apk
on:
  push:
  workflow_dispatch:
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unzip project
        run: |
          if [ -f QuietLauncher.zip ]; then unzip -q -o QuietLauncher.zip; fi
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Build
        run: |
          [ -d QuietLauncher ] || { echo "Upload QuietLauncher.zip first"; exit 0; }
          cd QuietLauncher
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        if: hashFiles('QuietLauncher/app/build/outputs/apk/debug/app-debug.apk') != ''
        with:
          name: quiet-launcher-apk
          path: QuietLauncher/app/build/outputs/apk/debug/app-debug.apk
